name: Stock Monitor — 4x Daily

on:
  schedule:
    # All times in UTC → JST = UTC+9
    - cron: '0 22 * * 1-5'   # → JST 07:00 Mon-Fri (盤前)
    - cron: '0 3  * * 2-6'   # → JST 12:00 Tue-Sat (盤中)
    - cron: '0 8  * * 2-6'   # → JST 17:00 Tue-Sat (收盤)
    - cron: '0 13 * * 1-5'   # → JST 22:00 Mon-Fri (美股盤中)

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      test_hour:
        description: 'Override hour (7/12/17/22) for testing'
        required: false
        default: ''

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Override hour for manual test
        if: ${{ github.event.inputs.test_hour != '' }}
        run: |
          echo "TEST_HOUR=${{ github.event.inputs.test_hour }}" >> $GITHUB_ENV

      - name: Run stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_HOUR:          ${{ env.TEST_HOUR }}
        run: python scripts/monitor.py
